baseURL = 'https://code-philly-community.pages.dev/'
languageCode = 'en-us'
title = 'C.O.D.E - Community of Developers & Engineers'
enableGitInfo = true
enableRobotsTXT = true
ignoreFiles = ["README\\.md$"]

[params]
shortName = 'C.O.D.E'
description = "Philadelphia's community of developers and engineers. Weekly meetups, workshops, and hackathons."
author = 'C.O.D.E Philadelphia'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menus.main]]
name = "Home"
url = "/"
weight = 10

[[menus.main]]
name = "Get Started"
url = "/onboarding/"
weight = 15

[[menus.main]]
name = "Media"
url = "/blog/"
weight = 25

[[menus.main]]
name = "Event Sponsorship"
url = "/event-sponsorship/"
weight = 50

[[menus.main]]
name = "Merch"
url = "https://nol-kky-shop.fourthwall.com/"
weight = 60

[[menus.main]]
name = "Community Fund"
url = "https://givebutter.com/c_o_d_e"
weight = 70

[outputs]
home = ["HTML", "RSS", "JSON"]
page = ["HTML"]
section = ["HTML", "RSS"]
