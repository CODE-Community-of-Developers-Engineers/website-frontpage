# Cloudflare Pages builds and deploys every push to main through its GitHub integration.
# This workflow only triggers the daily rebuild that refreshes the Tech Pulse data.
name: Daily Cloudflare Pages rebuild

on:
  # Refresh Tech Pulse data daily at 10:17 UTC (~6:17 ET during DST; ~5:17 ET during standard time)
  schedule:
    - cron: '17 10 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          : "${DEPLOY_HOOK_URL:?CLOUDFLARE_PAGES_DEPLOY_HOOK secret is not set}"
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
