<header>
    <div class="header-left">
        <div id="logo">
            <a href="{{ "/" | relURL }}">
                <img src="{{ "media/logo/transparent.png" | relURL }}" alt="Coffee cup icon logo" draggable="false">
            </a>
        </div>
        <h1>Code & Coffee</h1>
    </div>
    
    <!-- Mobile hamburger menu button -->
    <button id="mobile-menu-button" style="display: none; background: none; border: none; cursor: pointer; position: absolute; right: 15px; top: 15px; z-index: 1001;" aria-label="Open menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <path fill="#828282" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/>
        </svg>
    </button>
    
    <nav id="desktop-nav" class="header-right">
        {{ range .Site.Menus.main }}
            <div class="nav-container">
                <a href="{{ .URL }}" class="nav-link{{ if eq $.Page.RelPermalink .URL }} active{{ end }}" {{ if hasPrefix .URL "http" }}target="_blank"{{ end }}>{{ .Name }}</a>
            </div>
        {{ end }}
    </nav>
</header>
