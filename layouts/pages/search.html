{{ define "main" }}
<div class="container container-narrow" style="padding: 3rem 1.5rem;">
    <div class="blog-post">
        <h1>{{ .Title }}</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">{{ .Description }}</p>
        
        <!-- Search Interface -->
        <div style="margin-bottom: 3rem;">
            <div style="position: relative; margin-bottom: 1.5rem;">
                <input type="text" id="search-input" aria-label="Search website" placeholder="Search blog posts, pages, tutorials, and community content..."
                       style="width: 100%; padding: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-lg); font-size: 1.1rem; background: var(--background); color: var(--text-primary);">
            </div>
            
            <!-- Quick Filters -->
            <div style="margin-bottom: 2rem;">
                <div id="search-stats" role="status" style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.875rem; display: none;"></div>
                <h3 style="margin-bottom: 1rem; font-size: 1rem;">Quick Filters</h3>
                <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                    <button class="tag search-filter active" data-filter="all">All Content</button>
                    <button class="tag search-filter" data-filter="tutorial">Tutorials</button>
                    <button class="tag search-filter" data-filter="community">Community</button>
                    <button class="tag search-filter" data-filter="events">Events</button>
                    <button class="tag search-filter" data-filter="javascript">JavaScript</button>
                    <button class="tag search-filter" data-filter="beginners">Beginners</button>
                    <button class="tag search-filter" data-filter="nodejs">Node.js</button>
                    <button class="tag search-filter" data-filter="ai">AI/ML</button>
                </div>
            </div>
        </div>
        
        <!-- Search Results -->
        <div id="search-results" aria-live="polite">
            <div id="search-placeholder" style="text-align: center; color: var(--text-muted); padding: 3rem;">
                <h3>Start typing to search</h3>
                <p>Search through our blog posts, pages, tutorials, and community content.</p>
                <div id="content-summary" style="margin-top: 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; max-width: 600px; margin: 2rem auto 0;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Search Index Script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const basePath = window.siteBasePath || '';
    let searchIndex = [];
    let searchState = 'loading';

    function resolveSiteUrl(url) {
        if (/^https?:\/\//.test(url)) {
            return url;
        }

        const cleanUrl = url.startsWith('/') ? url : `/${url}`;
        if (!basePath || cleanUrl === basePath || cleanUrl.startsWith(`${basePath}/`)) {
            return cleanUrl;
        }

        return `${basePath}${cleanUrl}`;
    }
    
    async function buildSearchIndex() {
        searchState = 'loading';
        renderResults([], searchInput.value);
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        try {
            const response = await fetch(resolveSiteUrl('/index.json'), { signal: controller.signal });
            if (!response.ok) throw new Error(`Search index returned HTTP ${response.status}`);
            const content = await response.json();
            if (!Array.isArray(content) || content.some(item =>
                !item || typeof item.title !== 'string' || typeof item.url !== 'string')) {
                throw new Error('Invalid search index');
            }
            searchIndex = content.filter(item => item.title.trim());
            searchState = 'ready';
        } catch (error) {
            console.error('Error loading search index:', error);
            searchState = 'error';
        } finally {
            clearTimeout(timeout);
        }
        updateSearch();
    }

    // Search function
    function performSearch(query, filter = 'all') {
        if (searchState !== 'ready') return [];
        
        const searchQuery = query.toLowerCase().trim();
        if (!searchQuery) return [];
        
        console.log('Performing search for:', searchQuery, 'with filter:', filter);
        
        const results = searchIndex.filter(item => {
            if (filter !== 'all' && item.topic !== filter &&
                (!Array.isArray(item.tags) || !item.tags.includes(filter))) return false;
            
            // Then search content
            const searchableText = [
                item.title,
                item.description,
                item.content,
                item.author,
                item.topic,
                ...(Array.isArray(item.tags) ? item.tags : [])
            ].join(' ').toLowerCase();
            
            const matches = searchableText.includes(searchQuery);
            if (matches) {
                console.log('Match found:', item.title, item.type);
            }
            return matches;
        });
        
        console.log('Filtered results:', results.length);
        
        return results.sort((a, b) => {
            // Sort by relevance (title matches first, then featured posts, then by date)
            const aTitle = a.title.toLowerCase().includes(searchQuery);
            const bTitle = b.title.toLowerCase().includes(searchQuery);
            
            if (aTitle && !bTitle) return -1;
            if (!aTitle && bTitle) return 1;
            if (a.featured && !b.featured) return -1;
            if (!a.featured && b.featured) return 1;
            if (a.type === 'blog' && b.type === 'page') return -1;
            if (a.type === 'page' && b.type === 'blog') return 1;
            
            return new Date(b.date) - new Date(a.date);
        });
    }
    
    // Render only static markup with innerHTML; index content is assigned as text.
    function renderResults(results, query) {
        const resultsContainer = document.getElementById('search-results');
        const statsContainer = document.getElementById('search-stats');
        statsContainer.style.display = 'block';
        statsContainer.textContent = '';
        if (searchState === 'loading') {
            resultsContainer.textContent = 'Loading search…';
            return;
        }
        if (searchState === 'error') {
            resultsContainer.innerHTML = '<p>Search is temporarily unavailable. Please try again.</p><button type="button" class="btn btn-secondary" id="search-retry">Retry search</button>';
            document.getElementById('search-retry').addEventListener('click', buildSearchIndex);
            return;
        }
        if (!query.trim()) {
            resultsContainer.innerHTML = '<div id="search-placeholder" style="text-align: center; color: var(--text-muted); padding: 3rem;"><h3>Start typing to search</h3><p>Search through our blog posts, pages, tutorials, and community content.</p><div id="content-summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; max-width: 600px; margin: 2rem auto 0;"></div></div>';
            showContentSummary();
            return;
        }
        statsContainer.textContent = `${results.length} result${results.length !== 1 ? 's' : ''} found`;
        if (!results.length) {
            resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 3rem;"><h3>No results found</h3><p>Try different keywords or check your spelling.</p></div>';
            return;
        }
        resultsContainer.replaceChildren();
        results.forEach(item => {
            const card = document.createElement('div');
            card.className = 'search-result search-result-card';
            card.innerHTML = '<h3 class="search-result-heading"><a class="search-result-title"></a><span class="search-result-badge search-result-badge-featured">FEATURED</span><span class="search-result-badge search-result-type"></span></h3><div class="search-result-meta"></div><p class="search-result-description"></p><div class="search-result-tags"></div>';
            const link = card.querySelector('a');
            link.href = resolveSiteUrl(item.url);
            link.textContent = item.title;
            if (!item.featured) card.querySelector('.search-result-badge-featured').remove();
            card.querySelector('.search-result-type').textContent = item.type;
            const metadata = [item.type === 'blog' ? 'Blog Post' : 'Page', `by ${item.author}`, `${item.readingTime} min read`];
            if (item.topic) metadata.push(`Topic: ${item.topic}`);
            metadata.forEach(text => {
                const span = document.createElement('span');
                span.textContent = text;
                card.querySelector('.search-result-meta').append(span);
            });
            card.querySelector('.search-result-description').textContent = item.description || 'No description available.';
            if (Array.isArray(item.tags)) item.tags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'search-result-tag';
                span.textContent = tag;
                card.querySelector('.search-result-tags').append(span);
            });
            card.addEventListener('mouseenter', function() {
                this.style.borderColor = 'var(--primary-color)';
                this.style.boxShadow = 'var(--shadow)';
            });
            card.addEventListener('mouseleave', function() {
                this.style.borderColor = 'var(--border-color)';
                this.style.boxShadow = 'none';
            });
            resultsContainer.append(card);
        });
    }

    // Search input handling
    const searchInput = document.getElementById('search-input');
    const searchFilters = document.querySelectorAll('.search-filter');
    let currentFilter = 'all';
    let searchTimeout;
    
    function updateSearch() {
        const query = searchInput.value;
        renderResults(performSearch(query, currentFilter), query);
    }

    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(updateSearch, 300);
    });

    searchFilters.forEach(filter => {
        filter.addEventListener('click', function() {
            searchFilters.forEach(f => f.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.getAttribute('data-filter');
            searchInput.value = currentFilter === 'all' ? '' : currentFilter;
            searchInput.focus();
            updateSearch();
        });
    });

    // Show content summary on load
    function showContentSummary() {
        if (searchIndex.length > 0) {
            const blogCount = searchIndex.filter(i => i.type === 'blog').length;
            const pageCount = searchIndex.filter(i => i.type === 'page').length;
            const topics = [...new Set(searchIndex.map(i => i.topic))];
            
            document.getElementById('content-summary').innerHTML = `
                <div style="text-align: center; padding: 1rem; background: var(--background-secondary); border-radius: var(--radius); border: 1px solid var(--border-color);">
                    <strong>${blogCount}</strong><br>Blog Posts
                </div>
                <div style="text-align: center; padding: 1rem; background: var(--background-secondary); border-radius: var(--radius); border: 1px solid var(--border-color);">
                    <strong>${pageCount}</strong><br>Pages
                </div>
                <div style="text-align: center; padding: 1rem; background: var(--background-secondary); border-radius: var(--radius); border: 1px solid var(--border-color);">
                    <strong>${topics.length}</strong><br>Topics
                </div>
            `;
        }
    }
    
    buildSearchIndex();
    
    // Focus search input on page load
    searchInput.focus();
});
</script>
{{ end }}
