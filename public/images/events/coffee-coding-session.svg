<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E9E3DC"/>
      <stop offset="100%" style="stop-color:#D4C4B0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <!-- Coffee cup -->
  <ellipse cx="150" cy="180" rx="40" ry="45" fill="#8B4513"/>
  <ellipse cx="150" cy="175" rx="35" ry="40" fill="#D2691E"/>
  <ellipse cx="150" cy="170" rx="30" ry="35" fill="#3B2521"/>
  
  <!-- Steam -->
  <path d="M140 140 Q145 130 140 120 Q135 110 140 100" stroke="#BB8D5F" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M150 140 Q155 130 150 120 Q145 110 150 100" stroke="#BB8D5F" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M160 140 Q165 130 160 120 Q155 110 160 100" stroke="#BB8D5F" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Laptop -->
  <rect x="220" y="160" width="120" height="80" rx="5" fill="#2C2C2C"/>
  <rect x="225" y="165" width="110" height="60" fill="#000"/>
  <rect x="230" y="170" width="100" height="50" fill="#59969B"/>
  
  <!-- Code on screen -->
  <text x="235" y="185" font-family="monospace" font-size="8" fill="white">function brew() {</text>
  <text x="235" y="195" font-family="monospace" font-size="8" fill="white">  return coffee;</text>
  <text x="235" y="205" font-family="monospace" font-size="8" fill="white">}</text>
  
  <!-- Table -->
  <rect x="100" y="230" width="200" height="10" fill="#8B4513"/>
  
  <!-- Title -->
  <text x="200" y="40" font-family="Gloria Hallelujah" font-size="24" fill="#3B2521" text-anchor="middle">Weekend Coding</text>
  <text x="200" y="65" font-family="Gloria Hallelujah" font-size="24" fill="#3B2521" text-anchor="middle">Session</text>
</svg>