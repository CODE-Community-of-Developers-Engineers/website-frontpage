<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="eventsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BB8D5F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D2691E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#59969B;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="laptopScreen" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#eventsBg)"/>
  
  <!-- Coffee stains/rings -->
  <circle cx="120" cy="100" r="25" fill="#8B4513" opacity="0.3"/>
  <circle cx="120" cy="100" r="20" fill="none" stroke="#3D2914" stroke-width="2" opacity="0.4"/>
  <circle cx="680" cy="150" r="20" fill="#8B4513" opacity="0.25"/>
  <circle cx="680" cy="150" r="15" fill="none" stroke="#3D2914" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Laptop/coding setup -->
  <rect x="250" y="200" width="300" height="200" rx="15" fill="#2C2C2C"/>
  <rect x="260" y="210" width="280" height="160" rx="8" fill="url(#laptopScreen)"/>
  <rect x="250" y="400" width="300" height="20" rx="8" fill="#1a1a1a"/>
  
  <!-- Code on screen -->
  <rect x="270" y="230" width="120" height="8" rx="2" fill="#59969B"/>
  <rect x="270" y="250" width="180" height="8" rx="2" fill="#BB8D5F"/>
  <rect x="280" y="270" width="150" height="8" rx="2" fill="#E9E3DC"/>
  <rect x="280" y="290" width="100" height="8" rx="2" fill="#59969B"/>
  <rect x="270" y="310" width="200" height="8" rx="2" fill="#BB8D5F"/>
  <rect x="280" y="330" width="90" height="8" rx="2" fill="#E9E3DC"/>
  
  <!-- Coffee mug next to laptop -->
  <ellipse cx="600" cy="380" rx="25" ry="5" fill="#3D2914" opacity="0.4"/>
  <rect x="580" y="340" width="40" height="40" rx="5" fill="#8B4513"/>
  <ellipse cx="600" cy="340" rx="18" ry="3" fill="#3D2914"/>
  <path d="M620 350 Q635 360 620 370" stroke="#3D2914" stroke-width="4" fill="none"/>
  
  <!-- Steam from coffee -->
  <path d="M595 330 Q600 320 595 310" stroke="#E9E3DC" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M605 330 Q600 320 605 310" stroke="#E9E3DC" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Event calendar icons -->
  <rect x="150" y="120" width="60" height="60" rx="8" fill="#E9E3DC" opacity="0.9"/>
  <rect x="150" y="120" width="60" height="15" rx="8" fill="#59969B"/>
  <circle cx="160" cy="110" r="3" fill="#3D2914"/>
  <circle cx="200" cy="110" r="3" fill="#3D2914"/>
  <text x="180" y="160" text-anchor="middle" fill="#3D2914" font-family="Arial" font-size="24" font-weight="bold">23</text>
  
  <rect x="650" y="250" width="60" height="60" rx="8" fill="#E9E3DC" opacity="0.9"/>
  <rect x="650" y="250" width="60" height="15" rx="8" fill="#BB8D5F"/>
  <circle cx="660" cy="240" r="3" fill="#3D2914"/>
  <circle cx="700" cy="240" r="3" fill="#3D2914"/>
  <text x="680" y="290" text-anchor="middle" fill="#3D2914" font-family="Arial" font-size="24" font-weight="bold">24</text>
  
  <!-- People networking -->
  <circle cx="180" cy="450" r="15" fill="#E9E3DC" opacity="0.8"/>
  <circle cx="180" cy="445" r="5" fill="#59969B"/>
  <rect x="175" y="450" width="10" height="12" rx="2" fill="#59969B"/>
  
  <circle cx="220" cy="460" r="15" fill="#E9E3DC" opacity="0.8"/>
  <circle cx="220" cy="455" r="5" fill="#BB8D5F"/>
  <rect x="215" y="460" width="10" height="12" rx="2" fill="#BB8D5F"/>
  
  <path d="M195 455 Q205 450 215 455" stroke="#E9E3DC" stroke-width="2" fill="none"/>
  
  <text x="400" y="550" text-anchor="middle" fill="#E9E3DC" font-family="Gloria Hallelujah, cursive" font-size="42" font-weight="bold">Coding Events</text>
</svg>