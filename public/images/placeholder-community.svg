<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="coffeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D2914;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#59969B;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#BB8D5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coffeeCup" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D2914;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#coffeeBg)"/>
  
  <!-- Coffee beans scattered around -->
  <ellipse cx="150" cy="100" rx="8" ry="12" fill="#3D2914" opacity="0.8"/>
  <ellipse cx="680" cy="120" rx="6" ry="10" fill="#3D2914" opacity="0.7"/>
  <ellipse cx="100" cy="350" rx="7" ry="11" fill="#3D2914" opacity="0.8"/>
  <ellipse cx="720" cy="480" rx="8" ry="12" fill="#3D2914" opacity="0.6"/>
  
  <!-- Central coffee cup with steam -->
  <ellipse cx="400" cy="420" rx="80" ry="15" fill="#3D2914" opacity="0.3"/>
  <rect x="340" y="280" width="120" height="140" rx="8" fill="url(#coffeeCup)"/>
  <ellipse cx="400" cy="280" rx="60" ry="8" fill="#8B4513"/>
  <ellipse cx="400" cy="280" rx="55" ry="6" fill="#D2691E"/>
  
  <!-- Handle -->
  <path d="M460 320 Q490 340 460 360" stroke="#3D2914" stroke-width="8" fill="none"/>
  
  <!-- Steam wisps -->
  <path d="M380 260 Q385 240 375 220 Q370 200 380 180" stroke="#E9E3DC" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M400 260 Q395 240 405 220 Q410 200 400 180" stroke="#E9E3DC" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M420 260 Q425 240 415 220 Q410 200 420 180" stroke="#E9E3DC" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Community gathering circles -->
  <circle cx="200" cy="150" r="30" fill="#E9E3DC" opacity="0.9"/>
  <circle cx="600" cy="180" r="28" fill="#E9E3DC" opacity="0.9"/>
  <circle cx="180" cy="450" r="32" fill="#E9E3DC" opacity="0.9"/>
  <circle cx="620" cy="420" r="29" fill="#E9E3DC" opacity="0.9"/>
  
  <!-- People silhouettes in circles -->
  <circle cx="200" cy="140" r="8" fill="#59969B"/>
  <rect x="195" y="148" width="10" height="15" rx="2" fill="#59969B"/>
  
  <circle cx="600" cy="170" r="8" fill="#BB8D5F"/>
  <rect x="595" y="178" width="10" height="15" rx="2" fill="#BB8D5F"/>
  
  <circle cx="180" cy="440" r="8" fill="#59969B"/>
  <rect x="175" y="448" width="10" height="15" rx="2" fill="#59969B"/>
  
  <circle cx="620" cy="410" r="8" fill="#BB8D5F"/>
  <rect x="615" y="418" width="10" height="15" rx="2" fill="#BB8D5F"/>
  
  <text x="400" y="550" text-anchor="middle" fill="#E9E3DC" font-family="Gloria Hallelujah, cursive" font-size="42" font-weight="bold">Coffee & Community</text>
</svg>