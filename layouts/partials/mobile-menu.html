<!-- Mobile Menu Container -->
<div id="mobile-menu" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #E9E3DC; z-index: 1000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; overflow-y: auto;">
    <button id="mobile-menu-close" style="position: absolute; top: 70px; right: 20px; background-color: rgba(255,255,255,0.8); border: 2px solid #3B2521; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 24px; color: #3B2521; display: flex; align-items: center; justify-content: center; z-index: 1002;" aria-label="Close menu">✕</button>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 40px; width: 100%;">
        {{ range .Site.Menus.main }}
            <div style="width: 100%; max-width: 250px; text-align: center;">
                <a href="{{ .URL }}" style="display: block; padding: 12px 15px; border: 2px solid #59969B; border-radius: 5px; font-family: 'Gloria Hallelujah', sans-serif; color: #3B2521; text-decoration: none; font-size: 1.1rem; transition: all 0.2s ease;" {{ if hasPrefix .URL "http" }}target="_blank"{{ end }}>{{ .Name }}</a>
            </div>
        {{ end }}
    </div>
</div>
