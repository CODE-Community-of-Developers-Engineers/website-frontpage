name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_BASE_PATH: /

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.126.1'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate static data
        run: npm run generate:data

      - name: Validate events data
        run: npm run validate:events

      - name: Validate front matter
        run: npm run validate:frontmatter

      - name: Run unit and integration tests
        run: npm test

      - name: Build Hugo site
        run: npm run prod:build
        env:
          HUGO_ENVIRONMENT: production

      - name: Run end-to-end smoke tests
        run: npm run test:e2e

      - name: Check deployment artifact
        run: npm run check:site -- --dir public

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --root-dir ${{ github.workspace }}/public
            --exclude-path './public/index.xml'
            --exclude-path './public/blog/index.xml'
            --exclude-path './public/tags/*/index.xml'
            --exclude-path './public/sitemap.xml'
            --exclude '.*favicon\.ico$'
            --exclude '.*-cover\.jpg$'
            --exclude '.*hero-community\.jpg$'
            './public/**/*.html'
          fail: true
          jobSummary: true

      - name: Summary
        if: success()
        run: |
          echo "## ✅ PR Checks Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All validation checks completed successfully:" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Events data generated and validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Front matter validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Hugo build succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Internal links checked" >> $GITHUB_STEP_SUMMARY
