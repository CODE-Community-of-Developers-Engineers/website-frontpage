<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="projectsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#59969B;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#BB8D5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#59969B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="monitorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#projectsBg)"/>
  
  <!-- Coffee workspace ambiance -->
  <circle cx="150" cy="120" r="20" fill="#8B4513" opacity="0.3"/>
  <circle cx="150" cy="120" r="15" fill="none" stroke="#3D2914" stroke-width="2" opacity="0.4"/>
  <circle cx="650" cy="480" r="18" fill="#8B4513" opacity="0.25"/>
  
  <!-- Large monitor setup -->
  <rect x="200" y="150" width="400" height="280" rx="20" fill="#2C2C2C"/>
  <rect x="210" y="160" width="380" height="240" rx="12" fill="url(#monitorGlow)"/>
  <rect x="200" y="430" width="400" height="30" rx="15" fill="#1a1a1a"/>
  <ellipse cx="400" cy="470" rx="60" ry="8" fill="#3D2914" opacity="0.4"/>
  
  <!-- Code editor with syntax highlighting -->
  <rect x="220" y="180" width="20" height="200" fill="#3D2914" opacity="0.3"/>
  
  <!-- File tree -->
  <rect x="225" y="190" width="8" height="4" fill="#BB8D5F"/>
  <rect x="235" y="190" width="40" height="4" fill="#E9E3DC"/>
  <rect x="235" y="200" width="8" height="4" fill="#59969B"/>
  <rect x="245" y="200" width="35" height="4" fill="#E9E3DC"/>
  <rect x="235" y="210" width="8" height="4" fill="#59969B"/>
  <rect x="245" y="210" width="30" height="4" fill="#E9E3DC"/>
  
  <!-- Code content -->
  <rect x="250" y="190" width="80" height="6" fill="#59969B"/>
  <rect x="250" y="205" width="120" height="6" fill="#BB8D5F"/>
  <rect x="260" y="220" width="100" height="6" fill="#E9E3DC"/>
  <rect x="260" y="235" width="90" height="6" fill="#59969B"/>
  <rect x="250" y="250" width="140" height="6" fill="#BB8D5F"/>
  <rect x="260" y="265" width="80" height="6" fill="#E9E3DC"/>
  <rect x="250" y="280" width="110" height="6" fill="#59969B"/>
  
  <!-- Browser window -->
  <rect x="350" y="190" width="10" height="6" fill="#E74C3C"/>
  <rect x="365" y="190" width="10" height="6" fill="#F39C12"/>
  <rect x="380" y="190" width="10" height="6" fill="#27AE60"/>
  <rect x="350" y="210" width="120" height="80" fill="#E9E3DC" opacity="0.9"/>
  <rect x="360" y="220" width="100" height="8" fill="#59969B"/>
  <rect x="360" y="235" width="80" height="6" fill="#BB8D5F"/>
  <rect x="360" y="250" width="90" height="6" fill="#3D2914"/>
  
  <!-- Coffee mug on desk -->
  <ellipse cx="130" cy="400" rx="20" ry="4" fill="#3D2914" opacity="0.5"/>
  <rect x="115" y="370" width="30" height="30" rx="4" fill="#8B4513"/>
  <ellipse cx="130" cy="370" rx="12" ry="2" fill="#3D2914"/>
  <path d="M145 380 Q155 385 145 390" stroke="#3D2914" stroke-width="3" fill="none"/>
  
  <!-- Steam -->
  <path d="M125 360 Q130 350 125 340" stroke="#E9E3DC" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M135 360 Q130 350 135 340" stroke="#E9E3DC" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Notebook with sketches -->
  <rect x="620" y="300" width="120" height="150" rx="8" fill="#E9E3DC" opacity="0.9"/>
  <rect x="625" y="305" width="110" height="5" fill="#59969B" opacity="0.3"/>
  <circle cx="650" cy="330" r="15" fill="none" stroke="#59969B" stroke-width="2"/>
  <rect x="640" cy="340" width="20" height="10" fill="none" stroke="#BB8D5F" stroke-width="2"/>
  <path d="M680 330 L720 350 L680 370" stroke="#59969B" stroke-width="2" fill="none"/>
  
  <!-- Coffee beans scattered -->
  <ellipse cx="70" cy="200" rx="4" ry="6" fill="#3D2914" opacity="0.7"/>
  <ellipse cx="750" cy="250" rx="3" ry="5" fill="#3D2914" opacity="0.6"/>
  <ellipse cx="60" cy="450" rx="4" ry="6" fill="#3D2914" opacity="0.8"/>
  
  <text x="400" y="550" text-anchor="middle" fill="#E9E3DC" font-family="Gloria Hallelujah, cursive" font-size="42" font-weight="bold">Build Projects</text>
</svg>