name: Purge Cloudflare Cache

on:
  workflow_dispatch:
    inputs:
      purge_everything:
        description: "Purge entire zone cache?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      urls:
        description: "If purge_everything=false, enter newline-separated URLs to purge"
        required: false
        default: ""

jobs:
  purge:
    runs-on: ubuntu-latest

    steps:
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PURGE_EVERYTHING: ${{ inputs.purge_everything }}
          URLS: ${{ inputs.urls }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ZONE_ID}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ZONE_ID secrets."
            exit 1
          fi

          if [ "${PURGE_EVERYTHING}" = "true" ]; then
            echo "Purging entire zone cache..."
            payload='{"purge_everything":true}'
          else
            if [ -z "${URLS}" ]; then
              echo "purge_everything=false but no URLs provided."
              exit 1
            fi

            echo "Purging specific URLs..."
            # Convert newline-separated URLs into a JSON array
            files_json=$(printf '%s\n' "${URLS}" \
              | sed '/^\s*$/d' \
              | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')

            payload=$(python3 -c "import json,sys; print(json.dumps({'files': json.loads(sys.argv[1])}))" "${files_json}")
          fi

          echo "Payload: ${payload}"

          resp=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}")

          echo "${resp}"

          success=$(echo "${resp}" | python3 -c "import json,sys; print(json.load(sys.stdin).get('success', False))")
          if [ "${success}" != "True" ] && [ "${success}" != "true" ]; then
            echo "Cloudflare purge failed."
            exit 1
          fi

          echo "Cloudflare purge succeeded."
