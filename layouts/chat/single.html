{{ define "head" }}
<link rel="stylesheet" href="{{ "/css/drive-chat.css" | relURL }}?v={{ now.Unix }}">
{{ end }}

{{ define "main" }}
<section class="drive-chat-page">
    <div class="drive-chat-shell">
        <div class="drive-chat-heading">
            <img src="{{ "/media/logo.png" | relURL }}" alt="" aria-hidden="true">
            <div>
                <h1>{{ .Title }}</h1>
                <p>Ask questions from the Coffee & Code Philadelphia Drive docs.</p>
            </div>
        </div>

        <div class="drive-chat-panel" aria-live="polite">
            <div class="drive-chat-messages" id="drive-chat-messages">
                <div class="drive-chat-message drive-chat-message-agent">
                    <p>What would you like to know?</p>
                </div>
            </div>

            <form class="drive-chat-form" id="drive-chat-form">
                <label for="drive-chat-question" class="sr-only">Question</label>
                <textarea id="drive-chat-question" name="question" maxlength="500" rows="3" placeholder="Ask about events, resources, onboarding, or community docs..." required></textarea>
                <button type="submit">
                    <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                    <span>Ask</span>
                </button>
            </form>
        </div>
    </div>
</section>
{{ end }}

{{ define "scripts" }}
<script src="{{ "/js/drive-chat.js" | relURL }}?v={{ now.Unix }}"></script>
{{ end }}
